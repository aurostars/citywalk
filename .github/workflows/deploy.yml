name: Verify and deploy Citywalk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare failure diagnostics
        run: mkdir -p ci-artifacts

      - name: Run unit and component tests
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee ci-artifacts/unit-tests.log

      - name: Build production assets
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-artifacts/build.log

      - name: Install Chromium
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee ci-artifacts/playwright-install.log

      - name: Run browser acceptance tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee ci-artifacts/e2e.log

      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure-${{ github.run_attempt }}
          path: |
            ci-artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
